name: VariantLab release gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: variantlab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18
      - run: node script/bun.mjs install --frozen-lockfile
      - run: node script/bun.mjs run typecheck:web
      - run: node script/bun.mjs run lint:web
      - run: node script/bun.mjs test apps/web/src eslint
      - run: node script/bun.mjs run build:web
      - name: Sites connected Worker integration
        run: |
          node script/build-sites-worker.mjs .release/sites/server
          node script/test-sites-connected.mjs
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
      - run: node script/rust-toolchain.mjs fmt
      - run: node script/rust-toolchain.mjs clippy
      - run: node script/rust-toolchain.mjs test
      - run: node script/rust-toolchain.mjs contracts
      - run: git diff --exit-code -- packages/studio-contract/src/generated
      - run: node script/rust-toolchain.mjs wasm
      - run: node script/render-text-parity.mjs
  connected-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gate: [security, parity, scale, chaos, recovery, continuation, captions, performance]
    env:
      VARIANTLAB_M8_TEST_MODE: "0"
      VARIANTLAB_EXPECT_TEST_MODE_OFF: "1"
      VARIANTLAB_BASE_URL: http://127.0.0.1:32200
      PLAYWRIGHT_JSON_OUTPUT_NAME: .test-results/m8-compose/results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18
      - run: node script/bun.mjs install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: docker compose --env-file variantlab.env.example -f docker-compose.variantlab.yml -p variantlab-m8 up -d --build --wait
      - run: node script/m8-database-preflight.mjs
      - name: Sites D1 native renderer and private artifact gate
        if: matrix.gate == 'parity'
        env:
          VARIANTLAB_NATIVE_TEST: "1"
          VARIANTLAB_SITES_WORKER_IMAGE: variantlab-m8-worker:latest
        run: |
          node script/build-sites-worker.mjs .release/sites/server
          node script/test-sites-connected.mjs
      - name: Caption native/WASM toolchain
        if: matrix.gate == 'captions'
        run: node script/rust-toolchain.mjs contracts
      - name: Full immutable runtime inventory
        if: matrix.gate == 'security'
        run: node script/runtime-sbom.mjs
        env:
          VARIANTLAB_RUNTIME_WEB: variantlab-m8-web
      - name: Required production connected gate
        shell: bash
        run: |
          case '${{ matrix.gate }}' in
            security) spec='variantlab-m8-security.spec.ts variantlab-m8-auth.spec.ts variantlab-m8-localization.spec.ts' ;;
            parity) spec='variantlab-m8-connected.spec.ts'; export VARIANTLAB_RENDER_PARITY_GATE=1 ;;
            scale) spec='variantlab-m8-connected.spec.ts'; export VARIANTLAB_SCALE_GATE=1 ;;
            chaos) spec='variantlab-m8-connected.spec.ts'; export VARIANTLAB_SCALE_GATE=1 VARIANTLAB_CHAOS_GATE=1 ;;
            recovery) spec='variantlab-m8-connected.spec.ts'; export VARIANTLAB_WORKER_CRASH_GATE=1 ;;
            continuation) spec='variantlab-m8-connected.spec.ts'; export VARIANTLAB_M9_GATE=1 ;;
            captions) spec='variantlab-m8-caption-stress.spec.ts' ;;
            performance) node node_modules/@playwright/test/cli.js test --config playwright.performance.config.ts --grep 'M2 reference' --reporter=list,json; exit $? ;;
            *) exit 2 ;;
          esac
          node node_modules/@playwright/test/cli.js test --config playwright.m8-compose.config.ts $spec --reporter=list,json
      - name: Browser-local public demo artifact
        if: matrix.gate == 'security'
        env:
          VARIANTLAB_DEMO_SOURCE_URL: http://127.0.0.1:32200/variantlab
          VARIANTLAB_DEMO_CONTAINER: variantlab-m8-web
        run: |
          node script/build-demo-site.mjs
          node node_modules/@playwright/test/cli.js test --config playwright.demo.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variantlab-browser-${{ matrix.gate }}
          path: .test-results/m8-compose/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: matrix.gate == 'security'
        with:
          name: variantlab-runtime-inventory
          path: .release/runtime/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: matrix.gate == 'security'
        with:
          name: variantlab-public-demo
          path: dist/
          include-hidden-files: true
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18
      - run: node script/bun.mjs install --frozen-lockfile
      - run: node script/rust-toolchain.mjs test
      - run: node script/rust-toolchain.mjs fetch
      - run: node script/bun.mjs script/sbom.mjs --fetch-missing
      - run: git diff --exit-code -- docs/SBOM.cdx.json docs/SBOM-coverage.json
      - run: node script/release-source-bundle.mjs
      - run: node script/release-secret-scan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: variantlab-source-and-notices
          path: .release/third-party/
          include-hidden-files: true
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.1
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18
      - run: node script/bun.mjs install --frozen-lockfile
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Build production local-browser fixture
        run: node script/bun.mjs run build:web
        env:
          NEXT_PUBLIC_VARIANTLAB_M2_TEST_ADAPTER: "1"
          NEXT_PUBLIC_VARIANTLAB_M5_TEST_ADAPTER: "1"
          NEXT_PUBLIC_VARIANTLAB_M6_TEST_ADAPTER: "1"
          NEXT_PUBLIC_VARIANTLAB_M7_TEST_ADAPTER: "1"
      - run: node node_modules/@playwright/test/cli.js test --config playwright.config.ts --grep-invert 'M8|release HTML' --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: .test-results/local-browser/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: variantlab-local-browser
          path: .test-results/
          include-hidden-files: true


