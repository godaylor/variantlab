[package]
name = "variantlab-connected"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
async-stream = "0.3.6"
aws-config = "=1.8.8"
aws-credential-types = "=1.2.8"
aws-sdk-s3 = "=1.108.0"
aws-smithy-async = "=1.2.7"
aws-smithy-http = "=0.62.6"
aws-smithy-runtime = "=1.9.3"
aws-smithy-runtime-api = "=1.9.3"
aws-smithy-types = "=1.3.5"
axum = { version = "0.8.4", features = ["macros"] }
hmac = "0.12.1"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
job-contracts = { version = "0.1.0", path = "../../crates/job-contracts" }
redis = { version = "0.32.7", features = ["tokio-comp"] }
render-plan = { version = "0.1.0", path = "../../crates/render-plan" }
edit-engine = { version = "0.1.0", path = "../../crates/edit-engine" }
studio-model = { version = "0.1.0", path = "../../crates/studio-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "time", "io-util"] }
tower-http = { version = "0.6.6", features = ["catch-panic", "cors", "request-id", "set-header", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

variant-engine = { version = "0.1.0", path = "../../crates/variant-engine" }
